[project]
name = "ExplicitUtil"
version = "1.5"
description = "A utility library for managing media files"
readme = "README.MD"
authors = [
    { name = "Alchemist-Aloha" }
]
dependencies = [
    "tqdm",
    "namer",
    "pillow",
    "toml",
    "requests",
    "typer",
    "ffmpeg-python",
    "mutagen",
    "pathvalidate",
    "pony",
    "rapidfuzz",
    "requests-cache",
    "schedule",
    "watchdog",
    "zstandard",
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Alchemist-Aloha/explicit_util"

[project.scripts]
ExplicitUtil = "ExplicitUtil.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ExplicitUtil"]

[dependency-groups]
dev = [
    "ipykernel",
    "ipython",
    "numpy",
    "scipy",
]
